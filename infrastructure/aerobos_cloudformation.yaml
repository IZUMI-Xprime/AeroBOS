AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AeroBOS Cloud Infrastructure Stack
  Real-Time Optical Gas Imaging, Graviton Perception Engine,
  Amazon Bedrock Agentic Loop, Amazon Timestream Digital Twin, and Emergency SCADA Valve Trip.

Parameters:
  FacilityId:
    Type: String
    Default: PERMIAN_BASIN_FACILITY_04
    Description: Unique identifier of the industrial oil/gas production or processing site.
  OperatorEmail:
    Type: String
    Default: ehs-compliance@facility.energy
    Description: Email address for urgent EPA Subpart W / Title V blowout alarms.
  GravitonInstanceType:
    Type: String
    Default: c7g.2xlarge
    AllowedValues: [c7g.xlarge, c7g.2xlarge, c7g.4xlarge, c8g.2xlarge, c8g.4xlarge]
    Description: AWS Graviton Arm64 EC2 instance type for COOL vision pipeline execution.

Resources:
  # ===========================================================================
  # 1. Amazon S3 Storage for Optical Plume Evidence Snapshots
  # ===========================================================================
  PlumeEvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'aerobos-evidence-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNonIncidentSnapshots
            Status: Enabled
            ExpirationInDays: 90
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA

  # ===========================================================================
  # 2. Amazon Timestream Database for Real-Time Digital Twin Telemetry
  # ===========================================================================
  TimestreamDatabase:
    Type: AWS::Timestream::Database
    Properties:
      DatabaseName: AeroBOS_DigitalTwin

  OpticalGasPlumesTable:
    Type: AWS::Timestream::Table
    Properties:
      DatabaseName: !Ref TimestreamDatabase
      TableName: OpticalGasPlumes
      RetentionProperties:
        MemoryStoreRetentionPeriodInHours: 24
        MagneticStoreRetentionPeriodInDays: 365

  # ===========================================================================
  # 3. Amazon SNS Topic for Emergency Leak Dispatch
  # ===========================================================================
  EmergencyAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: AeroBOSEmergencyAlarms
      DisplayName: AeroBOS Industrial Safety & EPA Compliance Alarms

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref OperatorEmail
      TopicArn: !Ref EmergencyAlarmTopic

  # ===========================================================================
  # 4. AWS IoT Core SCADA Valve Thing & MQTT Rules
  # ===========================================================================
  IsolationValveThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: XV-1042-B
      AttributePayload:
        Attributes:
          Facility: !Ref FacilityId
          Sector: Battery-B
          PipeDiameter_Inches: "12"
          Rating: "ANSI 600"

  IoTRuleTimestreamIngestion:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: AeroBOS_Ingest_Timestream
      TopicRulePayload:
        RuleDisabled: false
        Sql: "SELECT * FROM 'aerobos/facilities/+/cameras/+/stream'"
        Actions:
          - Timestream:
              DatabaseName: !Ref TimestreamDatabase
              TableName: !Ref OpticalGasPlumesTable
              RoleArn: !GetAtt IoTToTimestreamRole.Arn
              Dimensions:
                - Name: FacilityId
                  Value: "${facility_id}"
                - Name: CameraId
                  Value: "${camera_id}"
                - Name: AssociatedValveId
                  Value: "${valve_id}"

  # ===========================================================================
  # 5. IAM Roles & Permissions
  # ===========================================================================
  IoTToTimestreamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TimestreamWritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - timestream:WriteRecords
                  - timestream:DescribeEndpoints
                Resource: !GetAtt OpticalGasPlumesTable.Arn

  GravitonEC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: AeroBOSPipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:Converse
                  - bedrock:InvokeModel
                Resource: '*'
              - Effect: Allow
                Action:
                  - timestream:WriteRecords
                  - timestream:DescribeEndpoints
                Resource: !GetAtt OpticalGasPlumesTable.Arn
              - Effect: Allow
                Action:
                  - iot:Publish
                  - iot:UpdateThingShadow
                Resource: '*'
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref EmergencyAlarmTopic
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub '${PlumeEvidenceBucket.Arn}/*'

Outputs:
  EvidenceBucketName:
    Description: S3 bucket storing false-color Schlieren snapshots
    Value: !Ref PlumeEvidenceBucket
  TimestreamDbName:
    Description: Timestream Database Name for Amazon Managed Grafana
    Value: !Ref TimestreamDatabase
  SNSTopicArn:
    Description: SNS Alert Topic ARN
    Value: !Ref EmergencyAlarmTopic
